# test yaml

model_name: "osp_next"
seed: 1024

output_dir: "/path/to/output"

training_iteration: 1000000
# ddp_size: 1
fsdp_size: 8
sp_size: 4
skiparse_sp_size: 2
use_sequence_parallel: False
use_skiparse_sequence_parallel: True
reshard_after_forward: False
explicit_prefetching_num_blocks: 2
gradient_checkpointing: True
gradient_accumulation_steps: 1
init_max_grad_norm: 1.0
log_interval: 1
save_interval: 1000
weight_dtype: "bf16"
ema_decay: 0.9993 # 0.9993 corresponds to a half-life of 1000 steps
ema_update_interval: 1
save_with_dcp_api: True
profiling: False

wandb_config:
  project_name: "osp_next"
  exp_name: "osp_next"

model_config:
  dim: 1536
  ffn_dim: 8960
  freq_dim: 256
  in_dim: 16
  num_heads: 12
  num_layers: 30
  out_dim: 16
  text_len: 512
  skiparse_model_type: "dual_end"
  sparse_ratio: 2
  num_full_blocks: 8
  pretrained_model_dir_or_checkpoint: "/path/to/model"

scheduler_config:
  scheduler_name: "flow_matching"
  use_dynamic_shifting: True
  use_logitnorm_time_sampling: True

vae_config:
  vae_path: "/path/to/vae"
  dtype: "fp16"

text_encoder_config:
  text_len: 512
  checkpoint_path: "/path/to/text_encoder"
  use_fsdp: True

data_config:
  batch_size: 1
  num_workers: 16
  pin_memory: False
  drop_last: True
  shuffle: True
  dataset_name: "wan_t2v"
  dataset_config:
    metafile_or_dir_path: "/path/to/train/dataset"
    text_tokenizer_path: "/path/to/text_tokenizer"
    text_drop_ratio: 0.1
    sample_height: 480
    sample_width: 832
    sample_num_frames: 81
    train_fps: 16
    tokenizer_max_length: 512
    return_prompt_mask: True
  sampler_name: "stateful_distributed"
  collator_name: "wan_t2v"
  
optimizer_config:
  lr: 0.00002 # 2e-5
  weight_decay: 0.001 # 1e-3
